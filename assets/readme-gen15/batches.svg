<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Requested batches after a 100-position accepted game</title><desc id="desc">13 fresh spans fit in one fresh batch; one further replay-only batch follows.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667c"/></marker></defs>
<rect width="960" height="100%" fill="white"/>
<text x="30" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#17324d" font-weight="600" text-anchor="start">Requested batches after a 100-position accepted game</text>
<text x="30" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">13 fresh spans fit in one fresh batch; one further replay-only batch follows.</text>
<text x="30" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#17324d" font-weight="600" text-anchor="start">Batch 1: fresh pass</text>
<rect x="30" y="132" width="351.5625" height="65" fill="#087f8c" rx="3"/>
<text x="205.78125" y="170.62" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="white" font-weight="600" text-anchor="middle">100 fresh</text>
<rect x="381.5625" y="132" width="267.1875" height="65" fill="#3868b2" rx="3"/>
<text x="515.15625" y="170.28" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="600" text-anchor="middle">76 teacher-weighted</text>
<rect x="648.75" y="132" width="281.25" height="65" fill="#52667c" rx="3"/>
<text x="789.375" y="170.28" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="600" text-anchor="middle">80 general replay</text>
<text x="30" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#17324d" font-weight="600" text-anchor="start">Batch 2: replay only</text>
<rect x="30" y="267" width="618.75" height="65" fill="#3868b2" rx="3"/>
<text x="339.375" y="305.62" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="white" font-weight="600" text-anchor="middle">176 teacher-weighted replay</text>
<rect x="648.75" y="267" width="281.25" height="65" fill="#52667c" rx="3"/>
<text x="789.375" y="305.28" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="600" text-anchor="middle">80 general replay</text>
<text x="30" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">Actual batches can be smaller: spans must fit whole and avoid already-selected identities.</text>
</svg>