<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="title desc">
<title id="title">Selecting the teacher for the next training game</title><desc id="desc">Win rates use completed greedy openings. Rematches and qualification can override the weights.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667c"/></marker></defs>
<rect width="960" height="100%" fill="white"/>
<text x="30" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#17324d" font-weight="600" text-anchor="start">Selecting the teacher for the next training game</text>
<text x="30" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">Win rates use completed greedy openings. Rematches and qualification can override the weights.</text>
<rect x="30" y="95" width="225" height="60" fill="#087f8c" rx="3"/>
<text x="142.5" y="131.12" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="white" font-weight="600" text-anchor="middle">25% uniform</text>
<rect x="255" y="95" width="675" height="60" fill="#3868b2" rx="3"/>
<text x="592.5" y="131.12" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="white" font-weight="600" text-anchor="middle">75% relative-weakness deficits</text>
<text x="30" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">Reserve probability for observed teachers below 58%; keep the base distribution for the rest.</text>
<rect x="30" y="212" width="405" height="48" fill="#b65d21" rx="3"/>
<text x="232.5" y="241.78" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="600" text-anchor="middle">45% reserved: weak teacher A</text>
<rect x="435" y="212" width="405" height="48" fill="#b65d21" rx="3"/>
<text x="637.5" y="241.78" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="600" text-anchor="middle">45% reserved: weak teacher B</text>
<rect x="840" y="212" width="90" height="48" fill="#52667c" rx="3"/>
<text x="885.0" y="240.76" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="600" text-anchor="middle">10% base</text>
<text x="30" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">Illustrative two-weak-teacher case. The 10% base can also add probability to A or B.</text>
<rect x="30" y="325" width="260" height="112" rx="8" fill="#edf4f8" stroke="#087f8c" stroke-width="1.5"/>
<text x="160.0" y="374.52" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">1. Active rematch?</text>
<text x="160.0" y="399.71999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="middle">Choose that teacher.</text>
<rect x="350" y="325" width="260" height="112" rx="8" fill="#edf4f8" stroke="#087f8c" stroke-width="1.5"/>
<text x="480.0" y="362.97999999999996" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#17324d" font-weight="600" text-anchor="middle">2. Latest not qualified?</text>
<text x="480.0" y="386.78" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="middle">Latest only, unless a known</text>
<text x="480.0" y="410.5799999999999" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="middle">historical teacher is weak.</text>
<rect x="670" y="325" width="260" height="112" rx="8" fill="#edf4f8" stroke="#087f8c" stroke-width="1.5"/>
<text x="800.0" y="362.97999999999996" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#17324d" font-weight="600" text-anchor="middle">3. Otherwise</text>
<text x="800.0" y="386.78" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="middle">Credit schedules latest;</text>
<text x="800.0" y="410.5799999999999" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="middle">sample historical teachers.</text>
<path d="M290 381 L350 381" fill="none" stroke="#52667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M610 381 L670 381" fill="none" stroke="#52667c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667c" font-weight="400" text-anchor="middle">no</text>
<text x="640" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667c" font-weight="400" text-anchor="middle">else</text>
<text x="30" y="481" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">One weak teacher reserves 45%; more than two share 90%. Unobserved teachers have no reserve.</text>
</svg>