<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Standard opening at MCTS depth setting 2</title><desc id="desc">K = 3 pawn actions + 128 wall placements = 131 root actions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667c"/></marker></defs>
<rect width="960" height="100%" fill="white"/>
<text x="30" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#17324d" font-weight="600" text-anchor="start">Standard opening at MCTS depth setting 2</text>
<text x="30" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">K = 3 pawn actions + 128 wall placements = 131 root actions.</text>
<rect x="30" y="94" width="900" height="60" rx="8" fill="#edf4f8" stroke="#087f8c" stroke-width="1.5"/>
<text x="480.0" y="131.48" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#17324d" font-weight="600" text-anchor="middle">Budget S = max(64 × 2, 2 × 131) = 262 simulations</text>
<rect x="30" y="188" width="450" height="65" fill="#087f8c" rx="3"/>
<text x="255.0" y="226.62" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="white" font-weight="600" text-anchor="middle">131 compulsory visits</text>
<rect x="480" y="188" width="450" height="65" fill="#3868b2" rx="3"/>
<text x="705.0" y="226.62" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="white" font-weight="600" text-anchor="middle">131 further comparisons</text>
<text x="30" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">Target for action a = visits(a) / 262. Compulsory visits contribute uniform weight 1/2.</text>
<text x="30" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">Example: [2, 3, 5] visits → [0.2, 0.3, 0.5]. Move temperature does not alter this target.</text>
</svg>