<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Tactical setup weighting: an illustrative band timeline</title><desc id="desc">A band of +2 lasts four recorded plies, then weakens to +1. This is a schematic example.</desc>
