<text x="273.0" y="258.44" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" font-weight="600" text-anchor="middle">Before lead starts at ply 6: mark plies 0–5</text>
<rect x="336" y="290" width="338" height="46" fill="#3868b2" rx="3"/>
<text x="505.0" y="318.44" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" font-weight="600" text-anchor="middle">Before weakening at ply 10: mark plies 4–9</text>
<text x="30" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#17324d" font-weight="600" text-anchor="start">Union: plies 0–9 receive base weight 3. Other plies receive base weight 1.</text>
<text x="30" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">Overlapping ranges count once. The final winner is not part of this selection rule.</text>
