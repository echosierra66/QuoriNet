<text x="30" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">Each example already has its own history input. Sample whole spans, never join games.</text>
<text x="30" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">A repeated position identity starts a new span, so some spans are shorter than eight.</text>
