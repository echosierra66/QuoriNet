<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">History input and replay spans are different</title><desc id="desc">Both use a limit of eight, but they operate at different levels.</desc>
