<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">Two search methods in the same training collection</title><desc id="desc">The loaded model determines the search path; the depth option has different meanings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667c"/></marker></defs>
<rect width="960" height="100%" fill="white"/>
<text x="30" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#17324d" font-weight="600" text-anchor="start">Two search methods in the same training collection</text>
<text x="30" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">The loaded model determines the search path; the depth option has different meanings.</text>
<rect x="30" y="105" width="250" height="88" rx="8" fill="#edf4f8" stroke="#087f8c" stroke-width="1.5"/>
<text x="155.0" y="142.52" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">Policy-capable model</text>
<text x="155.0" y="167.72" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="middle">Student / teachers 10–15</text>
<rect x="340" y="105" width="270" height="88" rx="8" fill="#edf4f8" stroke="#087f8c" stroke-width="1.5"/>
<text x="475.0" y="142.52" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">MCTS</text>
<text x="475.0" y="167.72" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="middle">Depth controls simulations</text>
<rect x="670" y="105" width="260" height="88" rx="8" fill="#edf4f8" stroke="#087f8c" stroke-width="1.5"/>
<text x="800.0" y="142.52" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">Policy target</text>
<text x="800.0" y="167.72" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="middle">Normalized root visits</text>
<path d="M280 149 L340 149" fill="none" stroke="#52667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M610 149 L670 149" fill="none" stroke="#52667c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="235" width="250" height="88" rx="8" fill="#edf4f8" stroke="#b65d21" stroke-width="1.5"/>
<text x="155.0" y="272.52" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">Value-only model</text>
<text x="155.0" y="297.71999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="middle">Teachers 1–9</text>
<rect x="340" y="235" width="270" height="88" rx="8" fill="#edf4f8" stroke="#b65d21" stroke-width="1.5"/>
<text x="475.0" y="272.52" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">Minimax + alpha–beta</text>
<text x="475.0" y="297.71999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="middle">Depth limits lookahead plies</text>
<rect x="670" y="235" width="260" height="88" rx="8" fill="#edf4f8" stroke="#b65d21" stroke-width="1.5"/>
<text x="800.0" y="272.52" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">Policy target</text>
<text x="800.0" y="297.71999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667c" font-weight="400" text-anchor="middle">One-hot searched action</text>
<path d="M280 279 L340 279" fill="none" stroke="#52667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M610 279 L670 279" fill="none" stroke="#52667c" stroke-width="2" marker-end="url(#arrow)"/>
</svg>